<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<!--
  /portfolio is a redirect, not a page.

  Every portfolio link on the site now points straight at the published Canva
  site, so this route only catches old links, bookmarks, and search results.
  GitHub Pages can't issue a real 302, so this is the closest equivalent: a
  meta refresh plus location.replace, both in the head, with no body UI at all.
  Nothing renders and nothing spins — the navigation happens before there is
  anything to paint.

  location.replace (rather than assignment) keeps this out of session history,
  so Back from Canva returns the visitor to the page they came from instead of
  bouncing them through this redirect again.
-->
<title>Portfolio | Worldwidewmal</title>
<link rel="canonical" href="https://worldwidewmal.my.canva.site"/>
<meta name="robots" content="noindex,follow"/>
<meta http-equiv="refresh" content="0;url=https://worldwidewmal.my.canva.site"/>
<script>location.replace('https://worldwidewmal.my.canva.site');</script>
<link rel="icon" href="/logo.png"/>
</head>
<body>
<a href="https://worldwidewmal.my.canva.site">Continue to the Worldwidewmal portfolio</a>
</body>
</html>
